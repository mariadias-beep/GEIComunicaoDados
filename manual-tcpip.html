<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual TCP/IP</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Arial,sans-serif;color:#1d2433;background:#eef3f9}
header{background:#0b3d91;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header h1{font-size:1.2rem;margin:0}#prog{flex:1;height:10px;background:#ffffff40;border-radius:6px;overflow:hidden}#bar{display:block;height:100%;width:0;background:#51cf66;transition:.3s}
.wrap{display:flex;gap:20px;max-width:1200px;margin:20px auto;padding:0 12px}nav{width:290px;flex:none;background:#fff;border-radius:10px;padding:8px;align-self:flex-start;position:sticky;top:70px;max-height:80vh;overflow:auto}
nav a{display:block;padding:6px 10px;border-radius:6px;color:#1d2433;text-decoration:none;font-size:.9rem}nav a:hover{background:#e7f0ff}nav a.on{background:#1f6feb;color:#fff}
main{flex:1;background:#fff;border-radius:10px;padding:24px;min-width:0}h2{color:#0b3d91;margin-top:0}h3{color:#1f6feb;border-bottom:2px solid #e7f0ff;padding-bottom:4px}
img{max-width:100%;height:auto;border:1px solid #d0dcec;border-radius:8px;margin:8px 0}.q{background:#f7faff;border:1px solid #d9e5f5;border-radius:8px;padding:12px;margin:12px 0}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 12px;border:1px solid #b9cbe6;border-radius:6px;background:#fff;cursor:pointer;font:inherit}.opt:hover{background:#e7f0ff}
.sel{background:#dbe8ff;border-color:#1f6feb}.ok{background:#d3f9d8!important;border-color:#2b8a3e}.bad{background:#ffe3e3!important;border-color:#c92a2a}.fb{margin:6px 0 0;font-size:.92rem}
table{border-collapse:collapse;width:100%}td{padding:6px;border-bottom:1px solid #e3ebf6}select,textarea,input[type=text]{font:inherit;padding:6px;border:1px solid #b9cbe6;border-radius:6px;max-width:100%}textarea{width:100%;min-height:100px}
.btn{background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:8px 16px;cursor:pointer;font:inherit;margin:6px 6px 6px 0}.btn.sec{background:#6c7a92}
.task{background:#fff8e1;border-left:5px solid #f59f00;padding:10px 14px;border-radius:6px;margin:14px 0}details{margin:8px 0}summary{cursor:pointer;color:#1f6feb;font-weight:600}
.pn{display:flex;justify-content:space-between;margin-top:20px}.big{font-size:2rem;font-weight:700;color:#0b3d91}
@media(max-width:800px){.wrap{flex-direction:column}nav{width:100%;position:static;max-height:200px}}
@media print{header,nav,.btn,.pn{display:none!important}body{background:#fff}main{padding:0}}
.fig svg{max-width:100%;height:auto;border:1px solid #d0dcec;border-radius:8px;margin:6px 0}</style></head><body><header><h1>🌐 Manual de TCP/IP</h1><div id="prog"><i id="bar"></i></div><span id="pct"></span></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>const T=[{"t":"🌐 Introdução e história do TCP/IP","th":"<p>A Internet nasceu da <b>ARPANET</b> (1969), financiada pelos EUA, com o objetivo de criar uma rede <b>resistente a falhas</b>, sem ponto central, que ligasse computadores de universidades e centros de investigação. Nos anos 70 surgiu o <b>TCP/IP</b>, a família de protocolos que permite a redes diferentes comunicar entre si; a ARPANET adotou-o oficialmente em 1983. O TCP/IP é aberto, independente do fabricante e hoje é a base de toda a Internet. O futuro passa pelo <b>IPv6</b> e pela Internet das Coisas.</p>","m":[{"q":"Porque foi desenvolvida a Internet?","o":["Para ligar redes diferentes numa rede descentralizada e resistente a falhas","Para vender publicidade","Para substituir a televisão","Para ligar apenas telemóveis"],"e":"A ideia era partilhar recursos entre redes sem um ponto único de falha."},{"q":"O TCP/IP é…","o":["Uma família de protocolos aberta e independente do fabricante","Um programa da Microsoft","Um cabo de rede","Um tipo de computador"],"e":"É um conjunto de protocolos abertos."}],"cl":{"q":"Verdadeiro ou falso?","o":["Verdadeiro","Falso"],"i":[["A ARPANET é anterior à Internet atual","Verdadeiro"],["O TCP/IP depende de um único fabricante","Falso"],["O IPv6 foi criado, entre outras razões, para resolver a falta de endereços","Verdadeiro"]]},"task":"Pesquisa e explica em 5 linhas porque a Internet foi criada e como o TCP/IP se encaixa nesse projeto.","ans":"ARPANET → rede descentralizada → TCP/IP interliga redes diferentes → evolução para a Internet global e o IPv6."},{"t":"🧱 As 4 camadas e a comparação com o OSI","th":"<p>O TCP/IP tem <b>4 camadas</b>: <b>Aplicação</b> (serviços usados pelo utilizador: HTTP, DNS…), <b>Transporte</b> (comunicação entre processos: TCP e UDP), <b>Internet</b> (endereçamento e encaminhamento: IP, ICMP) e <b>Acesso à rede</b> (envio físico na rede local: Ethernet, Wi-Fi). O <b>modelo OSI</b> tem 7 camadas: as três superiores do OSI (aplicação, apresentação, sessão) correspondem à Aplicação do TCP/IP, e as duas inferiores (ligação de dados e física) ao Acesso à rede. O OSI é um modelo de referência teórico; o TCP/IP é o usado na prática.</p><div class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 262\" font-family=\"Arial\" font-size=\"13\"><defs><marker id=\"a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8z\" fill=\"#e8590c\"/></marker></defs><rect width=\"560\" height=\"262\" fill=\"#f4f8fc\"/><text x=\"140\" y=\"18\" text-anchor=\"middle\" font-weight=\"bold\">Modelo OSI (7 camadas)</text><text x=\"420\" y=\"18\" text-anchor=\"middle\" font-weight=\"bold\">Modelo TCP/IP (4 camadas)</text><rect x=\"40\" y=\"30\" width=\"200\" height=\"28\" rx=\"6\" fill=\"#cfe2ff\" stroke=\"#1f6feb\" stroke-width=\"2\"/><text x=\"140\" y=\"48\" text-anchor=\"middle\" >Aplicação</text><rect x=\"40\" y=\"62\" width=\"200\" height=\"28\" rx=\"6\" fill=\"#cfe2ff\" stroke=\"#1f6feb\" stroke-width=\"2\"/><text x=\"140\" y=\"80\" text-anchor=\"middle\" >Apresentação</text><rect x=\"40\" y=\"94\" width=\"200\" height=\"28\" rx=\"6\" fill=\"#cfe2ff\" stroke=\"#1f6feb\" stroke-width=\"2\"/><text x=\"140\" y=\"112\" text-anchor=\"middle\" >Sessão</text><rect x=\"40\" y=\"126\" width=\"200\" height=\"28\" rx=\"6\" fill=\"#d3f9d8\" stroke=\"#2b8a3e\" stroke-width=\"2\"/><text x=\"140\" y=\"144\" text-anchor=\"middle\" >Transporte</text><rect x=\"40\" y=\"158\" width=\"200\" height=\"28\" rx=\"6\" fill=\"#ffe8cc\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"140\" y=\"176\" text-anchor=\"middle\" >Rede</text><rect x=\"40\" y=\"190\" width=\"200\" height=\"28\" rx=\"6\" fill=\"#ffe3e3\" stroke=\"#c92a2a\" stroke-width=\"2\"/><text x=\"140\" y=\"208\" text-anchor=\"middle\" >Ligação de dados</text><rect x=\"40\" y=\"222\" width=\"200\" height=\"28\" rx=\"6\" fill=\"#ffe3e3\" stroke=\"#c92a2a\" stroke-width=\"2\"/><text x=\"140\" y=\"240\" text-anchor=\"middle\" >Física</text><rect x=\"320\" y=\"30\" width=\"200\" height=\"92\" rx=\"6\" fill=\"#cfe2ff\" stroke=\"#1f6feb\" stroke-width=\"2\"/><text x=\"420\" y=\"72\" text-anchor=\"middle\" font-weight=\"bold\">Aplicação</text><text x=\"420\" y=\"88\" text-anchor=\"middle\" >HTTP, DNS, FTP, SMTP</text><rect x=\"320\" y=\"126\" width=\"200\" height=\"28\" rx=\"6\" fill=\"#d3f9d8\" stroke=\"#2b8a3e\" stroke-width=\"2\"/><text x=\"420\" y=\"144\" text-anchor=\"middle\" >Transporte (TCP, UDP)</text><rect x=\"320\" y=\"158\" width=\"200\" height=\"28\" rx=\"6\" fill=\"#ffe8cc\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"420\" y=\"176\" text-anchor=\"middle\" >Internet (IP, ICMP)</text><rect x=\"320\" y=\"190\" width=\"200\" height=\"60\" rx=\"6\" fill=\"#ffe3e3\" stroke=\"#c92a2a\" stroke-width=\"2\"/><text x=\"420\" y=\"216\" text-anchor=\"middle\" font-weight=\"bold\">Acesso à rede</text><text x=\"420\" y=\"232\" text-anchor=\"middle\" >Ethernet, Wi-Fi</text></svg></div>","m":[{"q":"Quantas camadas tem o modelo TCP/IP e quantas tem o OSI?","o":["4 e 7","7 e 4","5 e 7","3 e 7"],"e":"TCP/IP: 4 camadas; OSI: 7 camadas."}],"cl":{"q":"Em que camada TCP/IP atua cada protocolo?","o":["Aplicação","Transporte","Internet","Acesso à rede"],"i":[["HTTP","Aplicação"],["TCP","Transporte"],["IP","Internet"],["Ethernet","Acesso à rede"],["ICMP","Internet"]]},"task":"Desenha a correspondência entre as camadas OSI e TCP/IP e descreve a função de cada camada TCP/IP.","ans":"Aplicação = 7+6+5; Transporte = 4; Internet = 3; Acesso à rede = 2+1."},{"t":"🕸️ Arquitetura da Internet e Ethernet","th":"<p>A Internet é uma <b>rede de redes</b>: milhares de redes interligadas por <b>routers</b>, operadas por <b>ISP</b> (fornecedores de acesso) que trocam tráfego em pontos de interligação (IXP). Os endereços são atribuídos de forma hierárquica pela IANA e pelos registos regionais (na Europa, o RIPE NCC). Na rede local usa-se normalmente a <b>Ethernet</b>: cada placa tem um endereço <b>MAC</b> de 48 bits, os dados seguem em <b>tramas</b> e os <b>switches</b> encaminham as tramas pelo MAC. A Ethernet é a camada de acesso à rede; o IP trabalha por cima.</p>","m":[{"q":"Que equipamento interliga redes diferentes?","o":["Router","Switch","Placa de rede","Cabo de rede"],"e":"O router encaminha pacotes entre redes IP."},{"q":"Quantos bits tem um endereço MAC?","o":["48","32","128","8"],"e":"O MAC tem 48 bits."}],"cl":{"q":"Associa o equipamento/identificador à função.","o":["Router","Switch","Endereço MAC","ISP"],"i":[["Encaminha pacotes entre redes pelo endereço IP","Router"],["Liga dispositivos na rede local pelo endereço MAC","Switch"],["Identifica a placa de rede (48 bits)","Endereço MAC"],["Fornece o acesso à Internet","ISP"]]},"task":"Faz um esquema simples da ligação da tua casa à Internet (equipamentos e camadas envolvidas).","ans":"PC → switch/Wi-Fi → router → ISP → Internet; Ethernet na rede local, IP entre redes."},{"t":"🔢 Endereço IP e conversão decimal/binário","th":"<p>Um endereço <b>IPv4</b> tem <b>32 bits</b>, escritos em 4 <b>octetos</b> (0–255) separados por pontos. Identifica uma interface numa rede e tem uma parte de <b>rede</b> e uma parte de <b>host</b>. Para converter um octeto para binário, usa os pesos <b>128 64 32 16 8 4 2 1</b>: 192 = 128 + 64 → <b>11000000</b>; 168 = 128 + 32 + 8 → <b>10101000</b>; 255 = <b>11111111</b>.</p><div class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 215\" font-family=\"Arial\" font-size=\"13\"><defs><marker id=\"a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8z\" fill=\"#e8590c\"/></marker></defs><rect width=\"560\" height=\"215\" fill=\"#f4f8fc\"/><rect x=\"20\" y=\"40\" width=\"125\" height=\"40\" rx=\"6\" fill=\"#cfe2ff\" stroke=\"#1f6feb\" stroke-width=\"2\"/><text x=\"82.5\" y=\"64\" text-anchor=\"middle\" >11000000</text><text x=\"82\" y=\"105\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"16\">192</text><rect x=\"155\" y=\"40\" width=\"125\" height=\"40\" rx=\"6\" fill=\"#cfe2ff\" stroke=\"#1f6feb\" stroke-width=\"2\"/><text x=\"217.5\" y=\"64\" text-anchor=\"middle\" >10101000</text><text x=\"217\" y=\"105\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"16\">168</text><rect x=\"290\" y=\"40\" width=\"125\" height=\"40\" rx=\"6\" fill=\"#cfe2ff\" stroke=\"#1f6feb\" stroke-width=\"2\"/><text x=\"352.5\" y=\"64\" text-anchor=\"middle\" >00000001</text><text x=\"352\" y=\"105\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"16\">1</text><rect x=\"425\" y=\"40\" width=\"125\" height=\"40\" rx=\"6\" fill=\"#ffe8cc\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"487.5\" y=\"64\" text-anchor=\"middle\" >00001010</text><text x=\"487\" y=\"105\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"16\">10</text><path d=\"M20 125L415 125\" stroke=\"#1f6feb\" stroke-width=\"2\"/><text x=\"217\" y=\"145\" text-anchor=\"middle\" >Parte de rede (/24 = 255.255.255.0)</text><path d=\"M425 125L545 125\" stroke=\"#1f6feb\" stroke-width=\"2\"/><text x=\"485\" y=\"145\" text-anchor=\"middle\" >Host</text><text x=\"280\" y=\"22\" text-anchor=\"middle\" font-weight=\"bold\">Endereço IPv4: 192.168.1.10</text><text x=\"280\" y=\"190\" text-anchor=\"middle\" fill=\"#555\">32 bits = 4 octetos de 8 bits; cada octeto vai de 0 a 255</text></svg></div>","m":[{"q":"Quantos bits tem um endereço IPv4?","o":["32","8","64","128"],"e":"4 octetos × 8 bits = 32 bits."},{"q":"Qual é o valor decimal de 11111111?","o":["255","256","128","254"],"e":"128+64+32+16+8+4+2+1 = 255."}],"cl":{"q":"Converte para binário.","o":["11000000","10101000","11111111","00001010","10101100"],"i":[["192","11000000"],["168","10101000"],["255","11111111"],["10","00001010"],["172","10101100"]]},"task":"Converte 200, 100 e 50 para binário e escreve o teu IP em binário (ipconfig / ip a).","ans":"200 = 11001000; 100 = 01100100; 50 = 00110010."},{"t":"🏷️ Classes de endereços e endereços reservados","th":"<p>No endereçamento por <b>classes</b>, o 1.º octeto define a classe: <b>A</b> 1–126 (máscara /8), <b>B</b> 128–191 (/16), <b>C</b> 192–223 (/24), <b>D</b> 224–239 (multicast) e <b>E</b> 240–255 (experimental). Hoje usa-se o endereçamento sem classes (CIDR), mas as classes continuam a ser úteis para estudar. <b>Reservados:</b> <b>127.0.0.0/8</b> (loopback, 127.0.0.1 é a própria máquina), <b>0.0.0.0</b> (endereço indefinido), <b>255.255.255.255</b> (broadcast), o primeiro endereço de cada rede (identifica a rede), o último (broadcast da rede) e <b>169.254.0.0/16</b> (autoatribuição quando não há DHCP).</p>","m":[{"q":"Para que serve o endereço 127.0.0.1?","o":["Testar a própria máquina (loopback)","Aceder ao router","Broadcast da rede","Aceder à Internet"],"e":"É o endereço de loopback."}],"cl":{"q":"Qual é a classe do endereço?","o":["A","B","C","D","E"],"i":[["10.0.0.1","A"],["150.20.1.5","B"],["200.10.5.1","C"],["230.1.1.1","D"],["245.0.0.1","E"]]},"task":"Indica a classe, a máscara padrão e o nº de redes/hosts de 3 endereços à tua escolha.","ans":"Ex.: 200.10.5.1 → classe C, máscara 255.255.255.0, 254 hosts por rede."},{"t":"🔒 IP públicos, privados e sub-redes","th":"<p>Os endereços <b>públicos</b> são únicos na Internet; os <b>privados</b> (RFC 1918) só circulam em redes internas: <b>10.0.0.0/8</b>, <b>172.16.0.0–172.31.255.255 (/12)</b> e <b>192.168.0.0/16</b>. O <b>NAT</b> do router traduz privados em público para sair para a Internet.</p><p>A <b>divisão em sub-redes</b> é necessária para organizar a rede, reduzir o tráfego de broadcast, melhorar a segurança e aproveitar os endereços. A <b>máscara</b> indica a parte de rede (/24 = 255.255.255.0). Hosts utilizáveis = 2<sup>n</sup> − 2 (n = bits de host): numa /24 há 254 hosts; numa /26 há 62.</p>","m":[{"q":"Quantos hosts utilizáveis tem uma rede /24?","o":["254","256","255","24"],"e":"2⁸ − 2 = 254 (menos rede e broadcast)."},{"q":"Quantos hosts utilizáveis tem uma rede /26?","o":["62","64","30","126"],"e":"2⁶ − 2 = 62."}],"cl":{"q":"Público ou privado?","o":["Público","Privado"],"i":[["192.168.1.10","Privado"],["8.8.8.8","Público"],["172.20.4.1","Privado"],["172.32.0.1","Público"],["10.5.5.5","Privado"]]},"task":"Divide 192.168.10.0/24 em 4 sub-redes /26 e indica rede, 1.º host, último host e broadcast de cada uma.","ans":"192.168.10.0, .64, .128, .192; ex. a 1.ª: hosts .1–.62, broadcast .63."},{"t":"🆕 IPv4 versus IPv6","th":"<p>O IPv4 tem 32 bits, ou seja, cerca de 4,3 mil milhões de endereços, que se esgotaram. O <b>IPv6</b> tem <b>128 bits</b>, escritos em 8 grupos de 16 bits em hexadecimal, por exemplo <b>2001:db8::1</b> (o «::» substitui grupos de zeros, só uma vez). Não usa broadcast, tem autoconfiguração e suporte nativo a IPsec. Durante a transição os dois coexistem (dupla pilha, túneis).</p>","m":[{"q":"Quantos bits tem um endereço IPv6?","o":["128","32","64","256"],"e":"128 bits."}],"cl":{"q":"IPv4 ou IPv6?","o":["IPv4","IPv6"],"i":[["32 bits","IPv4"],["128 bits","IPv6"],["192.168.0.1","IPv4"],["2001:db8::1","IPv6"],["Usa broadcast","IPv4"]]},"task":"Compara IPv4 e IPv6 em 5 pontos.","ans":"Tamanho, notação, nº de endereços, broadcast/multicast, configuração e segurança."},{"t":"📥 Obter um endereço IP: estático, RARP, BOOTP e DHCP","th":"<p>O endereço pode ser <b>estático</b> (definido à mão; para servidores, impressoras, routers) ou <b>dinâmico</b> (atribuído automaticamente). Os endereços públicos são fornecidos pelo ISP, que os recebe dos registos regionais. Protocolos históricos: <b>RARP</b> (obtém o IP a partir do MAC; obsoleto) e <b>BOOTP</b> (servidor dá IP, UDP 67/68; antecessor do DHCP). O <b>DHCP</b> dá IP, máscara, gateway e DNS por um tempo (<i>lease</i>) em 4 passos, <b>DORA</b>: Discover, Offer, Request, Acknowledge.</p>","m":[{"q":"Qual é o tipo de endereço mais adequado para um servidor?","o":["Estático","Dinâmico, sempre diferente","Loopback","Multicast"],"e":"O endereço do servidor deve ser fixo e conhecido."}],"cl":{"q":"Ordena os passos do DHCP (DORA).","o":["Discover","Offer","Request","Acknowledge"],"i":[["O cliente procura servidores DHCP por broadcast","Discover"],["O servidor propõe um endereço","Offer"],["O cliente aceita a oferta","Request"],["O servidor confirma a atribuição","Acknowledge"]]},"task":"Compara estático e dinâmico: vantagens e quando usar cada um.","ans":"Estático: previsível, para servidores; dinâmico: automático, para clientes."},{"t":"🔎 ARP e resolução de endereços","th":"<p>Na rede local os dispositivos comunicam pelo <b>MAC</b>, mas as aplicações usam o <b>IP</b>. O <b>ARP</b> resolve isso: o emissor envia em <b>broadcast</b> «Quem tem o IP X?» e o dono responde com o seu MAC; o resultado fica na <b>cache ARP</b> (<code>arp -a</code>). Se o destino está noutra rede, o ARP pede o MAC do <b>gateway</b>, que encaminha o pacote. Problemas: ARP não tem autenticação (ARP spoofing). O <b>ICMP</b> envia mensagens de erro e controlo (ex.: <code>ping</code>).</p>","m":[{"q":"Para enviar um pacote para outra rede, o ARP procura o MAC…","o":["Do gateway (router)","Do destino final","Do servidor DNS","Do ISP"],"e":"O pacote é entregue primeiro ao gateway."}],"cl":{"q":"Qual é o papel de cada protocolo?","o":["ARP","ICMP","IP","TCP","UDP"],"i":[["Traduz endereços IP em endereços MAC","ARP"],["Reporta erros e responde ao ping","ICMP"],["Encaminha pacotes entre redes","IP"],["Entrega fiável, com confirmações","TCP"],["Entrega rápida, sem garantias","UDP"]]},"task":"Executa arp -a e ping a um dispositivo; descreve o que observas.","ans":"A tabela mostra pares IP–MAC; o ping usa ICMP (echo request/reply)."},{"t":"📦 Camada de transporte: TCP e UDP","th":"<p>A camada de transporte liga <b>processos</b> através de <b>portas</b>. O <b>TCP</b> é orientado à ligação e fiável: usa o <b>handshake triplo</b> (SYN, SYN-ACK, ACK), <b>confirmações</b> (ACK), <b>controlo de fluxo</b> e <b>janelamento</b> (a janela diz quantos dados podem ser enviados sem confirmação) e termina com FIN. O <b>UDP</b> é simples e rápido, sem ligação nem garantias (voz, vídeo, DNS). Portas: 0–1023 conhecidas, 1024–49151 registadas, 49152–65535 dinâmicas.</p><div class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 235\" font-family=\"Arial\" font-size=\"13\"><defs><marker id=\"a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8z\" fill=\"#e8590c\"/></marker></defs><rect width=\"560\" height=\"235\" fill=\"#f4f8fc\"/><text x=\"120\" y=\"22\" text-anchor=\"middle\" font-weight=\"bold\">Cliente</text><text x=\"440\" y=\"22\" text-anchor=\"middle\" font-weight=\"bold\">Servidor</text><path d=\"M120 30L120 210\" stroke=\"#1f6feb\" stroke-width=\"2\"/><path d=\"M440 30L440 210\" stroke=\"#1f6feb\" stroke-width=\"2\"/><path d=\"M122 55L438 95\" stroke=\"#e8590c\" stroke-width=\"2.5\" marker-end=\"url(#a)\"/><text x=\"280\" y=\"62\" text-anchor=\"middle\" >1. SYN («quero ligar-me»)</text><path d=\"M438 110L122 150\" stroke=\"#e8590c\" stroke-width=\"2.5\" marker-end=\"url(#a)\"/><text x=\"280\" y=\"118\" text-anchor=\"middle\" >2. SYN-ACK («ok, também quero»)</text><path d=\"M122 165L438 205\" stroke=\"#e8590c\" stroke-width=\"2.5\" marker-end=\"url(#a)\"/><text x=\"280\" y=\"172\" text-anchor=\"middle\" >3. ACK («confirmado»)</text><text x=\"280\" y=\"230\" text-anchor=\"middle\" fill=\"#555\">Ligação estabelecida: já se podem trocar dados</text></svg></div>","m":[{"q":"Qual é a ordem do handshake triplo?","o":["SYN, SYN-ACK, ACK","ACK, SYN, FIN","SYN, ACK, FIN","FIN, ACK, SYN"],"e":"O cliente envia SYN, o servidor SYN-ACK e o cliente ACK."},{"q":"O janelamento serve para…","o":["Limitar quantos dados se enviam sem confirmação","Abrir janelas no ecrã","Cifrar dados","Atribuir IP"],"e":"Regula o fluxo entre emissor e recetor."}],"cl":{"q":"TCP ou UDP?","o":["TCP","UDP"],"i":[["Transferência de ficheiros (FTP)","TCP"],["Chamada de voz em tempo real","UDP"],["Handshake triplo","TCP"],["Sem estabelecimento de ligação","UDP"],["Envio de e-mail (SMTP)","TCP"]]},"task":"Explica por que o TCP é fiável e o UDP é rápido, com um exemplo de cada.","ans":"TCP: confirmações e retransmissões (web, e-mail); UDP: sem overhead (voz, jogos)."},{"t":"🧩 Camada de aplicação: DNS, HTTP, FTP, SMTP, SNMP, Telnet","th":"<p>A camada de aplicação oferece os serviços ao utilizador. <b>DNS</b> (porta 53) traduz nomes em IP; <b>HTTP</b> (80) e <b>HTTPS</b> (443) transportam páginas web; <b>FTP</b> (21) transfere ficheiros; <b>SMTP</b> (25) envia e-mail (receber: POP3 e IMAP); <b>SNMP</b> (161) monitoriza equipamentos de rede; <b>Telnet</b> (23) dá acesso remoto sem cifrar, por isso foi substituído pelo <b>SSH</b> (22).</p>","m":[{"q":"Porque é que o Telnet não é recomendado?","o":["Não cifra as comunicações","É demasiado rápido","Usa UDP","Só funciona em IPv6"],"e":"As palavras-passe circulam em texto simples."}],"cl":{"q":"Associa o protocolo à porta.","o":["21","23","25","53","80"],"i":[["FTP","21"],["Telnet","23"],["SMTP","25"],["DNS","53"],["HTTP","80"]]},"task":"Escolhe 3 protocolos e explica quando cada um é usado.","ans":"DNS ao abrir um site; SMTP ao enviar e-mail; SNMP para monitorizar um router."},{"t":"🏢 Arquiteturas proprietárias","th":"<p>Antes de o TCP/IP se impor, os fabricantes criaram redes próprias, por necessidade e para controlar o mercado. A <b>Novell NetWare</b> (IPX/SPX) tornou-se muito usada em partilha de ficheiros e impressoras nos anos 80 e 90. A <b>AppleTalk</b> (LocalTalk, EtherTalk) ligava Macs e periféricos com configuração automática. Existiam ainda a <b>SNA</b> (IBM) e a <b>DECnet</b> (DEC). Foram sendo substituídas pelo TCP/IP, aberto e interoperável.</p>","m":[{"q":"Hoje, a maioria das redes usa…","o":["TCP/IP","IPX/SPX","AppleTalk","DECnet"],"e":"O TCP/IP é o padrão universal."}],"cl":{"q":"Associa a tecnologia ao fabricante.","o":["Novell","Apple","IBM","DEC"],"i":[["IPX/SPX","Novell"],["LocalTalk / EtherTalk","Apple"],["SNA","IBM"],["DECnet","DEC"]]},"task":"Explica o que eram as arquiteturas proprietárias e por que perderam importância.","ans":"Fechadas e incompatíveis entre si; o TCP/IP é aberto e interoperável."},{"t":"🗺️ Planeamento de endereços e consolidação","th":"<p>Para planear, levanta o <b>número de dispositivos</b> de cada rede, acrescenta margem de crescimento, escolhe um bloco <b>privado</b>, divide em <b>sub-redes</b> e reserva endereços fixos (gateway, servidores) e um intervalo DHCP. Exemplo: 192.168.10.0/24 → laboratório (50 PCs) em 192.168.10.0/26 e administração (20) em 192.168.10.64/26. Resumo: Ethernet entrega na rede local, IP encaminha entre redes, TCP/UDP entregam ao processo certo e a aplicação usa o serviço.</p>","m":[{"q":"Para 50 computadores, qual é a máscara mínima adequada (com algum crescimento)?","o":["/26 (62 hosts)","/27 (30 hosts)","/28 (14 hosts)","/30 (2 hosts)"],"e":"Com 50 hosts é preciso, no mínimo, 62 endereços: /26."}],"ck":["Contei os dispositivos de cada rede","Previ margem de crescimento","Escolhi um bloco privado","Dividi em sub-redes sem sobreposição","Reservei gateway e servidores estáticos","Defini o intervalo DHCP"],"task":"Planeia uma rede de escola com 3 sub-redes (lab 50, administração 20, Wi-Fi 100) e justifica as máscaras.","ans":"Lab /26 (62), administração /27 (30), Wi-Fi /25 (126), sem sobreposição."}];
T.forEach(x=>{if(x.cl)x.cl.i=x.cl.i.map(([a,b])=>[a,x.cl.o.indexOf(b)])});
const $=s=>document.querySelector(s);let S={};try{S=JSON.parse(localStorage.getItem("tcpip13")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("tcpip13",JSON.stringify(S))}catch(e){}};
const tot=x=>(x.m||[]).length+(x.cl?x.cl.i.length:0);
const hs=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7);
function sc(i){const x=T[i];let r=0;(x.m||[]).forEach((q,j)=>{if(S[`m${i}_${j}`]===0)r++});if(x.cl&&S["v"+i])x.cl.i.forEach((it,k)=>{if(S[`c${i}_${k}`]===it[1])r++});return r}
function done(i){const x=T[i];return (x.m||[]).every((q,j)=>S[`m${i}_${j}`]!==undefined)&&(!x.cl||S["v"+i])}
function render(){const h=location.hash.slice(1);const res=h==="res";const i=res?-1:Math.min(+h||0,T.length-1);
$("#nav").innerHTML=T.map((x,k)=>`<a href="#${k}" class="${k===i?"on":""}">${done(k)?"✓ ":""}${k+1}. ${x.t}</a>`).join("")+`<a href="#res" class="${res?"on":""}">📊 Resultados</a>`;
const n=T.filter((x,k)=>done(k)).length;$("#bar").style.width=n/T.length*100+"%";$("#pct").textContent=n+"/"+T.length;
$("#main").innerHTML=res?pRes():pTopic(i);scrollTo(0,0)}
function pTopic(i){const x=T[i];let h=`<h2>${i+1}. ${x.t}</h2><h3>Conteúdo</h3>${x.th}<h3>Exercícios</h3>`;
(x.m||[]).forEach((q,j)=>{const k=`m${i}_${j}`,ch=S[k];h+=`<div class="q"><p>${q.q}</p>`+q.o.map((t,o)=>[t,o]).sort((a,b)=>hs(a[0]+j)-hs(b[0]+j)).map(([t,o])=>`<button class="opt ${ch===undefined?"":o===0?"ok":o===ch?"bad":""}" data-k="${k}" data-v="${o}">${t}</button>`).join("")+(ch===undefined?"":`<p class="fb">${ch===0?"✔ Correto. ":"✘ Incorreto. "}${q.e}</p>`)+`</div>`});
if(x.cl){const c=x.cl,v=S["v"+i];h+=`<div class="q"><p>${c.q}</p><table>`+c.i.map((it,k)=>{const s=S[`c${i}_${k}`];return `<tr class="${v?(s===it[1]?"ok":"bad"):""}"><td>${it[0]}</td><td><select data-i="${i}" data-k="c${i}_${k}"><option value="-1">— escolhe —</option>${c.o.map((t,o)=>`<option value="${o}"${s===o?" selected":""}>${t}</option>`).join("")}</select></td><td>${v?(s===it[1]?"✔":"✘ "+c.o[it[1]]):""}</td></tr>`}).join("")+`</table><button class="btn" data-ver="${i}">Verificar</button></div>`}
if(x.ck)h+=`<div class="q"><p><b>Lista de verificação</b></p>`+x.ck.map((t,j)=>`<label><input type="checkbox" data-k="k${i}_${j}"${S[`k${i}_${j}`]?" checked":""}> ${t}</label><br>`).join("")+`</div>`;
h+=`<div class="task"><b>Tarefa prática:</b> ${x.task}</div><textarea data-n="n${i}" placeholder="Escreve aqui a tua resposta…">${S["n"+i]||""}</textarea><details><summary>Ver resposta exemplo</summary><p>${x.ans}</p></details>`;
return h+`<div class="pn"><a class="btn sec" href="#${Math.max(i-1,0)}">← Anterior</a><a class="btn" href="#${i+1<T.length?i+1:"res"}">${i+1<T.length?"Seguinte →":"Resultados"}</a></div>`}
function pRes(){let s=0,t=0;const r=T.map((x,i)=>{const a=sc(i),b=tot(x);s+=a;t+=b;return `<tr><td>${i+1}. ${x.t}</td><td>${done(i)?a+"/"+b:"por fazer"}</td></tr>`}).join("");
return `<h2>Resultados</h2><p>Nome do aluno: <input type="text" data-nome value="${S.nome||""}"></p><p class="big">${s}/${t} (${Math.round(s/t*100)}%)</p><table>${r}</table><button class="btn" onclick="print()">🖨️ Imprimir / Guardar em PDF</button><button class="btn sec" data-reset>Apagar resultados</button>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-k].opt");if(b){S[b.dataset.k]=+b.dataset.v;sv();return render2()}
if(e.target.dataset.ver){S["v"+e.target.dataset.ver]=1;sv();render2()}
if(e.target.dataset.reset!==undefined&&confirm("Apagar todos os resultados?")){S={};sv();render()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.i){S[t.dataset.k]=+t.value;S["v"+t.dataset.i]=0;sv();render2()}else if(t.type==="checkbox"){S[t.dataset.k]=t.checked;sv()}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.n){S[t.dataset.n]=t.value;sv()}if(t.dataset.nome!==undefined){S.nome=t.value;sv()}});
function render2(){const y=scrollY;render();scrollTo(0,y)}
addEventListener("hashchange",render);render();
</script></body></html>
